services:
  postgres:
    image: postgres:16-alpine
    container_name: labinsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labinsight_db
      POSTGRES_USER: labinsight_app
      POSTGRES_PASSWORD: labinsight_dev_secret_pw_123
    ports:
      # Bind strictly to localhost to prevent public network exposure
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labinsight_app -d labinsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labinsight-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labinsight-backend
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://labinsight_app:labinsight_dev_secret_pw_123@postgres:5432/labinsight_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_insecure_secret_key_generate_with_openssl_rand_hex_64_for_production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/app:/app/app
      - backend_uploads:/app/uploads
      - backend_reports:/app/generated_reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labinsight-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
  backend_reports:
